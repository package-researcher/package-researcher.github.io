<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>호주 시드니 완전일주 5박7일 패키지</title>
<meta property="og:title" content="호주 시드니 완전일주 5박7일 패키지">
<meta property="og:description" content="모두투어 · 아시아나 직항 · 9월 기준 243만원대">
<meta property="og:image" content="../covers/sydney-7d.jpg">
<link rel="icon" href="../logo.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --cream:#F7F3EA; --navy:#1E2C46; --red:#E03131; --green:#03C75A;
    --muted:#8B98A9; --line:#E8E1D4; --card:#fff;
  }
  body{
    font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;
    background:var(--cream); color:var(--navy);
    min-height:100vh; display:flex; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:540px;padding:38px 20px 64px}
  a{text-decoration:none;color:inherit}

  /* 헤더 */
  .hd{text-align:center;margin-bottom:30px}
  .hd img{width:86px;height:86px;border-radius:50%;display:block;margin:0 auto 14px;
          box-shadow:0 8px 22px rgba(30,44,70,.16)}
  .hd h1{font-size:26px;font-weight:800;letter-spacing:-.6px}
  .hd p{font-size:15px;color:var(--muted);margin-top:7px;font-weight:500}

  /* 섹션 라벨 */
  .sec{display:flex;align-items:center;gap:12px;margin:32px 0 15px}
  .sec span{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:1.4px;white-space:nowrap}
  .sec i{flex:1;height:1px;background:var(--line)}

  /* 편 카드 (목록) */
  .ep{display:flex;align-items:center;gap:15px;background:var(--card);
      border-radius:18px;padding:13px 15px;margin-bottom:12px;
      box-shadow:0 2px 10px rgba(30,44,70,.06);
      border:1px solid rgba(30,44,70,.045);
      transition:transform .14s ease, box-shadow .14s ease}
  .ep:active{transform:scale(.985);box-shadow:0 1px 5px rgba(30,44,70,.09)}
  .ep .th{width:64px;height:80px;border-radius:12px;object-fit:cover;flex:none;
          background:var(--line)}
  .ep .bd{flex:1;min-width:0}
  .ep .no{display:inline-block;font-size:11.5px;font-weight:800;color:var(--red);
          background:#FDECEC;border-radius:6px;padding:2.5px 8px;margin-bottom:6px;
          letter-spacing:.4px}
  .ep .no.new{color:#fff;background:var(--red)}
  .ep b{display:block;font-size:16px;font-weight:800;line-height:1.34;letter-spacing:-.3px}
  .ep .mt{display:block;font-size:12.5px;color:var(--muted);margin-top:5px;font-weight:500}
  .ep .arw{flex:none;color:#C6CEDA;font-size:22px;font-weight:700;padding-left:2px}

  /* 채널 바로가기 */
  .ch{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .ch a{display:flex;flex-direction:column;align-items:center;gap:7px}
  .ch .ic{width:100%;aspect-ratio:1;border-radius:15px;display:flex;
          align-items:center;justify-content:center;
          box-shadow:0 3px 9px rgba(30,44,70,.10)}
  .ch .ic svg{width:23px;height:23px}
  .ch span{font-size:11.5px;color:var(--muted);font-weight:700}

  .notice{font-size:12px;color:var(--muted);text-align:center;line-height:1.75;margin-top:34px}

  /* 상세 페이지 */
  .back{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;
        color:var(--muted);margin-bottom:18px}
  .hero{width:100%;border-radius:20px;display:block;margin-bottom:20px;
        box-shadow:0 6px 20px rgba(30,44,70,.13)}
  .dt .no{display:inline-block;font-size:12px;font-weight:800;color:#fff;
          background:var(--red);border-radius:7px;padding:4px 11px;letter-spacing:.4px}
  .dt h1{font-size:24px;font-weight:800;line-height:1.35;letter-spacing:-.5px;margin:12px 0 9px}
  .dt .sub{font-size:15px;color:#55637A;font-weight:600;margin-bottom:4px}
  .dt .date{font-size:13px;color:var(--muted);font-weight:500}
  .btns{margin-top:24px;display:flex;flex-direction:column;gap:11px}
  .btns a{display:flex;align-items:center;justify-content:center;gap:9px;
          font-weight:800;font-size:16.5px;padding:16px 0;border-radius:15px;color:#fff;
          box-shadow:0 3px 10px rgba(30,44,70,.12);transition:transform .12s}
  .btns a:active{transform:scale(.985)}
  .btns svg{width:21px;height:21px}
  .b-y{background:var(--red)} .b-n{background:var(--green)} .b-b{background:var(--navy)}
  .b-b small{font-weight:500;font-size:12.5px;opacity:.75}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">‹ 전체 목록</a>
  <div class="dt">
    <img class="hero" src="../covers/sydney-7d.jpg" alt="">
    <span class="no">10편</span>
    <h1>호주 시드니 완전일주 5박7일 패키지</h1>
    <p class="sub">모두투어 · 아시아나 직항 · 9월 기준 243만원대</p>
    <p class="date">2026.08.30 공개</p>
    <div class="btns">
      <a class="b-n" href="https://blog.naver.com/robotnady10/224394625742"><svg viewBox="0 0 24 24" fill="#fff"><path d="M16.3 4v8.5L7.7 4H4v16h3.7v-8.5L16.3 20H20V4h-3.7z"/></svg>블로그에서 읽기</a>
      <a class="b-n" href="https://blog.naver.com/robotnady10/224394622715"><svg viewBox="0 0 24 24" fill="#fff"><path d="M16.3 4v8.5L7.7 4H4v16h3.7v-8.5L16.3 20H20V4h-3.7z"/></svg>고를 때 확인할 것들</a>
      <a class="b-b" href="https://naver.me/xIF0sU7I">이 상품 예약 페이지 열기 <small>제휴</small></a>
    </div>
  </div>
  <script>
  (function () {
    var m = location.search.match(/[?&]from=([a-z]+)/);
    if (!m) return;
    document.querySelectorAll('a.b-b').forEach(function (a) {
      try {
        var u = new URL(a.href);
        u.searchParams.set('utm_source', m[1]);
        u.searchParams.set('utm_medium', 'linkpage');
        a.href = u.toString();
      } catch (e) { /* 단축 URL 등은 그대로 둔다 */ }
    });
  })();
  </script>

  <p class="notice">예약 링크는 제휴 링크이며, 예약 시 일정 수수료를 받습니다. 가격은 동일합니다.<br>패키지연구소</p>
</div>
</body>
</html>
